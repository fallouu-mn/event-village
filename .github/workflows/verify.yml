name: verify

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · tests (Supabase local) · build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Démarrer Supabase local (services nécessaires aux tests uniquement)
        run: |
          set -o pipefail
          supabase start -x studio,imgproxy,logflare,vector,edge-runtime 2>&1 | tee /tmp/supabase-start.log

      - name: Appliquer toutes les migrations depuis zéro (supabase db reset)
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee /tmp/db-reset.log

      - name: Générer .env.test depuis l'instance locale
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase.env
          set +a
          ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "$API_URL" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ] || [ -z "$DB_URL" ]; then
            echo "Impossible de lire API_URL / ANON_KEY / SERVICE_ROLE_KEY / DB_URL depuis supabase status"; exit 1
          fi
          sed -e "s#^NEXT_PUBLIC_SUPABASE_URL=.*#NEXT_PUBLIC_SUPABASE_URL=${API_URL}#" \
              -e "s#^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*#NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON}#" \
              -e "s#^SUPABASE_SERVICE_ROLE_KEY=.*#SUPABASE_SERVICE_ROLE_KEY=${SERVICE}#" \
              -e "s#^SUPABASE_DB_URL=.*#SUPABASE_DB_URL=${DB_URL}#" \
              .env.test.example > .env.test
          echo ".env.test généré : $(grep -c . .env.test) lignes (URL=${API_URL})"

      - name: Seed de test (idempotent, données fictives)
        run: |
          set -o pipefail
          npm run seed:test 2>&1 | tee /tmp/seed.log

      - name: Vérification complète (typecheck → lint → tests → build)
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/verify.log

      - name: Journal du conteneur Supabase Auth (diagnostic en cas d'échec)
        if: failure()
        run: |
          for c in $(docker ps -a --format "{{.Names}}" | grep -E "supabase_(auth|db)_" ); do
            echo "===== $c =====" >> /tmp/containers.log
            docker logs --tail 300 "$c" >> /tmp/containers.log 2>&1 || true
          done
          grep -iE "error|sqlstate|failed" /tmp/containers.log | tail -60 || true

      - name: Annotations d'erreur (extraits bruts des journaux)
        if: failure()
        run: |
          for f in /tmp/db-reset.log /tmp/seed.log /tmp/verify.log; do
            [ -f "$f" ] || continue
            msg=$(tail -c 1800 "$f" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=$(basename "$f")::${msg}"
          done

      - name: Publier les journaux bruts sur la branche ci-results
        if: always()
        env:
          RUN_DIR: runs/${{ github.run_number }}-${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          mkdir -p /tmp/ci-results && cd /tmp/ci-results
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q origin ci-results 2>/dev/null; then
            git checkout -q -b ci-results FETCH_HEAD
          else
            git checkout -q --orphan ci-results
          fi
          mkdir -p "$RUN_DIR"
          for f in supabase-start db-reset seed verify containers; do
            [ -f "/tmp/$f.log" ] && cp "/tmp/$f.log" "$RUN_DIR/$f.log"
          done
          if [ -d "$GITHUB_WORKSPACE/.test-logs" ]; then cp -r "$GITHUB_WORKSPACE/.test-logs" "$RUN_DIR/test-logs"; fi
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "job_status=${JOB_STATUS}"
            echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUN_DIR/run.txt"
          git add -A
          git commit -q -m "ci-results: run ${{ github.run_number }} (${{ github.sha }}) — ${JOB_STATUS}"
          git push -q origin ci-results
          echo "Journaux publiés : ${{ github.server_url }}/${{ github.repository }}/tree/ci-results/${RUN_DIR}"

      - name: Journaux des suites de tests (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .test-logs/
          if-no-files-found: ignore
