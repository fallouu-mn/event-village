name: verify

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'lot*/**'
      # Audit de sécurité du module événements : la branche audit/evenements doit avoir son run (consigne de l'audit)
      - 'audit/**'
      # Finitions (finition-1/equipe…) : runs « avant » et « après » exigés par la consigne de chaque finition
      - 'finition-*/**'
      # Lots de sécurité (securite/deconnexion-hors-ligne…) : run rouge, runs rapides et run complet exigés par la consigne
      - 'securite/**'
      # Lot CI rapide : branches de la CI elle-même (ci/parallele, ci/reference-serie)
      - 'ci/**'
      # Correctifs des contre-vérifications (correctifs/cvf2b…) : run rapide puis run complet exigés par la consigne
      - 'correctifs/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# ── Lot CI rapide : la vérification complète en jobs parallèles ─────────────────────────────────────────────────────
# Avant : un seul job, en série (verify ≈ 2 600 à 3 000 s, puis e2e ≈ 2 000 s), 85 à 91 min, au-delà de la limite.
# Après : mêmes contrôles, mêmes suites, mêmes commandes, répartis sur des runners distincts qui tournent en même temps :
#   mode     lit le message du commit (ligne « ci-rapide: », ligne « ci-lots-graine: ») ; quelques secondes
#   qualite  typecheck · lint (scripts/verify.mjs --etapes typecheck,lint) ; liste des suites (run-tests.mjs --list)
#   tests    4 lots équilibrés par durée (scripts/ci-lots.mjs, durées : scripts/ci-durees.json), chacun sur SA base
#            Supabase locale : mêmes migrations depuis zéro, même seed, mêmes invariants (after() de chaque suite),
#            même lanceur scripts/run-tests.mjs (garde-fou, délai par suite, temps réel avant suites lourdes)
#   e2e      build et poids JavaScript (verify.mjs --etapes build puis js-budget), puis l'e2e complet, inchangé
#            (connexion, captures, emails, dev-page, fumée, terrain, pwa, deconnexion, fake-prod, perf, recette)
#   verdict  vert seulement si TOUS les jobs le sont ET si les lots couvrent exactement la liste des suites, chacune
#            une fois ; publie les journaux et captures sur ci-results (un seul dossier par run, scripts/ci-verdict.mjs)
# Mode rapide (ligne « ci-rapide: <suites> ») : un seul job « rapide », identique à l'ancien mode rapide, puis verdict.
# Chaque job : 60 min au plus (les 120 min du lot sécurité visaient l'ancien job unique, en série : sans objet ici).
# Étapes chronométrées comme avant (/tmp/etape.sh → etapes.txt → run.txt, par job).

jobs:
  mode:
    name: mode (complet ou rapide)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      t0: ${{ steps.t0.outputs.t0 }}
      rapide: ${{ steps.mode.outputs.rapide }}
      suites: ${{ steps.mode.outputs.suites }}
      graine: ${{ steps.mode.outputs.graine }}
      lots: ${{ steps.mode.outputs.lots }}
    steps:
      - name: Horodatage du début du run
        id: t0
        run: echo "t0=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      # Finition 3a : mode rapide pendant le travail d'un lot. Une ligne « ci-rapide: <suites> » dans le message du
      # commit poussé fait tourner typecheck, lint et ces seules suites (scripts/ci-rapide.mjs), sans build, sans e2e
      # ni mesure du poids JavaScript. Sans cette ligne : vérification complète. La CI complète reste la seule preuve
      # finale d'un lot.
      # Lot CI rapide : une ligne « ci-lots-graine: <entier> » mélange la répartition des suites dans les lots
      # (scripts/ci-lots.mjs --graine) : d'autres voisinages, pour montrer qu'aucune suite ne dépend d'une autre.
      - name: Mode de vérification (lignes « ci-rapide » et « ci-lots-graine » du message du commit)
        id: mode
        run: |
          message="$(git log -1 --format=%B "$GITHUB_SHA")"
          ligne="$(printf '%s\n' "$message" | grep -m1 -E '^ci-rapide:' || true)"
          if [ -n "$ligne" ]; then
            suites="$(printf '%s' "${ligne#ci-rapide:}" | xargs)"
            if [ -z "$suites" ]; then echo "Ligne ci-rapide sans suite : rien à vérifier"; exit 1; fi
            echo "rapide=1" >> "$GITHUB_OUTPUT"
            echo "suites=$suites" >> "$GITHUB_OUTPUT"
            echo "Mode rapide : $suites"
          else
            echo "rapide=0" >> "$GITHUB_OUTPUT"
            echo "Mode complet"
          fi
          graine="$(printf '%s\n' "$message" | grep -m1 -E '^ci-lots-graine:' | sed -E 's/^ci-lots-graine:[[:space:]]*//' | xargs || true)"
          if [ -n "$graine" ]; then
            if ! printf '%s' "$graine" | grep -qE '^[0-9]+$'; then echo "ci-lots-graine : entier attendu (reçu : $graine)"; exit 1; fi
            echo "graine=$graine" >> "$GITHUB_OUTPUT"
            echo "Répartition mélangée des lots, graine $graine"
          fi
          echo "lots=4" >> "$GITHUB_OUTPUT"

  # ── Mode rapide : inchangé (typecheck, lint, suites citées), sur une base locale ──────────────────────────────────
  rapide:
    name: rapide (typecheck · lint · suites citées)
    needs: mode
    if: ${{ needs.mode.outputs.rapide == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EV_RAPIDE_SUITES: ${{ needs.mode.outputs.suites }}
    steps:
      # Lot 8 (contrat 15.9) : chaque étape `run` s'ouvre par `. /tmp/etape.sh <nom>`, qui note son début, sa fin et
      # son code de sortie dans /tmp/etapes.txt ; recopié dans run.txt (par job). Mesure seule.
      # Lot CI rapide (run 309, lot 4 : « failed to bind host port 0.0.0.0:54322 : address already in use » aux deux
      # tentatives) : les ports de Supabase local (54320-54329) sont dans la plage des ports éphémères du noyau
      # (32768-60999) ; une connexion sortante (npm ci…) peut en occuper un. Ils sont réservés dès le début du job.
      - &horodatage
        name: Horodatage du début du job (et ports de Supabase local réservés)
        run: |
          echo "EV_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          cat > /tmp/etape.sh <<'EOS'
          EV_ETAPE="$1"
          EV_ETAPE_DEBUT="$(date +%s)"
          trap 'code=$?; echo "$EV_ETAPE $EV_ETAPE_DEBUT $(date +%s) $code" >> /tmp/etapes.txt' EXIT
          EOS

      - &checkout
        name: Checkout
        uses: actions/checkout@v4

      - &node
        name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lot 8 (AR11, L71) : le lock régénéré exige npm 10 (npm 11 le réécrit) ; version lue dans le journal et run.txt
      - &npm-ci
        name: Installer les dépendances
        run: |
          . /tmp/etape.sh npm-ci
          npm --version
          echo "EV_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"
          npm ci

      - &supabase-cli
        name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - &supabase-start
        name: Démarrer Supabase local (services nécessaires aux tests uniquement)
        # Lot 7 (runs 81 et 82) : le runner a refusé deux fois le port 54322 (« address already in use ») avant tout
        # test. On journalise qui écoute sur les ports locaux, puis une seule nouvelle tentative après un arrêt propre.
        # Lot CI rapide : scripts/ci-supabase-start.sh (trois tentatives au lieu de deux ; sockets de tous états sur
        # ces ports, pas seulement ceux à l'écoute, écrits dans supabase-start.log).
        run: |
          . /tmp/etape.sh supabase-start
          code=0
          bash scripts/ci-supabase-start.sh /tmp/supabase-start.log || code=$?
          tail -n 60 /tmp/supabase-start.log
          exit "$code"

      - &db-reset
        name: Appliquer toutes les migrations depuis zéro (supabase db reset)
        run: |
          . /tmp/etape.sh db-reset
          set -o pipefail
          supabase db reset 2>&1 | tee /tmp/db-reset.log

      - &env-test
        name: Générer .env.test depuis l'instance locale
        run: |
          . /tmp/etape.sh env-test
          supabase status -o env > /tmp/supabase.env
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase.env
          set +a
          ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "$API_URL" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ] || [ -z "$DB_URL" ]; then
            echo "Impossible de lire API_URL / ANON_KEY / SERVICE_ROLE_KEY / DB_URL depuis supabase status"; exit 1
          fi
          sed -e "s#^NEXT_PUBLIC_SUPABASE_URL=.*#NEXT_PUBLIC_SUPABASE_URL=${API_URL}#" \
              -e "s#^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*#NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON}#" \
              -e "s#^SUPABASE_SERVICE_ROLE_KEY=.*#SUPABASE_SERVICE_ROLE_KEY=${SERVICE}#" \
              -e "s#^SUPABASE_DB_URL=.*#SUPABASE_DB_URL=${DB_URL}#" \
              .env.test.example > .env.test
          echo ".env.test généré : $(grep -c . .env.test) lignes (URL=${API_URL})"

      - &seed-test
        name: Seed de test (idempotent, données fictives)
        run: |
          . /tmp/etape.sh seed-test
          set -o pipefail
          npm run seed:test 2>&1 | tee /tmp/seed.log

      - name: Vérification rapide (typecheck, lint, suites citées par le commit)
        run: |
          . /tmp/etape.sh verify-rapide
          set -o pipefail
          # shellcheck disable=SC2086
          node scripts/ci-rapide.mjs $EV_RAPIDE_SUITES 2>&1 | tee /tmp/verify.log

      - &diagnostic
        name: Journal des conteneurs Supabase (diagnostic en cas d'échec)
        if: failure()
        run: |
          . /tmp/etape.sh diagnostic-conteneurs
          for c in $(docker ps -a --format "{{.Names}}" | grep -E "supabase_(auth|db)_" ); do
            echo "===== $c =====" >> /tmp/containers.log
            docker logs --tail 300 "$c" >> /tmp/containers.log 2>&1 || true
          done
          # Lot 7 (temps-reel-billets, runs 83, 86, 87) : journal de Realtime, filtré sur la durée de tout le job
          # (et non les 300 dernières lignes) : limites de débit (MessagePerSecondRateLimitReached), erreurs et reprises
          # du lecteur de changements, arrêts du flux.
          for c in $(docker ps -a --format "{{.Names}}" | grep -E "supabase_realtime_" ); do
            echo "===== $c (filtré) =====" >> /tmp/containers.log
            # -A 14 : le corps multiligne d'une erreur Postgrex (code, message, requête) suit la ligne d'en-tête ;
            # au run 88, sans lui, la cause des deux PoolingReplicationError restait illisible.
            docker logs -t "$c" 2>&1 | grep -iE -A 14 "PoolingReplicationError|ReplicationConnectionDown" | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jeton masqué>/g' | tail -300 >> /tmp/containers.log || true
            echo "----- $c (autres lignes filtrées) -----" >> /tmp/containers.log
            docker logs -t "$c" 2>&1 | grep -iE "ratelimit|rate_limit|too many|error|warn|retry|stopping|slot|poller|subscri" | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jeton masqué>/g; s/(access_token|apikey|token)=[^ &"]+/\1=<masqué>/gI' | tail -400 >> /tmp/containers.log || true
          done
          # Lot 7 (run 88) : côté Postgres, sur tout le job, les annulations et erreurs des appels du lecteur de
          # changements de Realtime (realtime.list_changes, fente de réplication), avec leur instruction.
          for c in $(docker ps -a --format "{{.Names}}" | grep -E "supabase_db_" ); do
            echo "===== $c (lecteur Realtime, filtré) =====" >> /tmp/containers.log
            docker logs -t "$c" 2>&1 | grep -iE -A 3 "canceling statement|statement timeout|list_changes|replication slot|logical decoding" | grep -viE "password|secret" | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jeton masqué>/g' | tail -200 >> /tmp/containers.log || true
          done
          grep -iE "error|sqlstate|failed" /tmp/containers.log | tail -60 || true

      - &annotations
        name: Annotations d'erreur (extraits bruts des journaux)
        if: failure()
        run: |
          for f in /tmp/db-reset.log /tmp/seed.log /tmp/verify.log /tmp/build.log /tmp/e2e-seed.log /tmp/e2e.log; do
            [ -f "$f" ] || continue
            msg=$(tail -c 1800 "$f" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=$(basename "$f")::${msg}"
          done

      # Journaux du job, réunis pour le job « verdict » (qui publie seul sur ci-results)
      - &rassembler
        name: Rassembler les journaux du job
        if: always()
        run: |
          mkdir -p /tmp/sortie
          for f in supabase-start db-reset seed verify build containers e2e-install e2e-seed fake-services next-start e2e; do
            [ -f "/tmp/$f.log" ] && cp "/tmp/$f.log" "/tmp/sortie/$f.log"
          done
          [ -f /tmp/etapes.txt ] && cp /tmp/etapes.txt /tmp/sortie/etapes.txt
          [ -f /tmp/liste-suites.txt ] && cp /tmp/liste-suites.txt /tmp/sortie/liste-suites.txt
          if [ -d "$GITHUB_WORKSPACE/.test-logs" ]; then cp -r "$GITHUB_WORKSPACE/.test-logs" /tmp/sortie/test-logs; fi
          {
            echo "debut=${EV_JOB_STARTED_AT:-}"
            echo "fin=$(date +%s)"
            echo "statut=${{ job.status }}"
            echo "npm_version=${EV_NPM_VERSION:-}"
          } > /tmp/sortie/job.txt
          echo "journaux du job : $(find /tmp/sortie -type f | wc -l) fichier(s)"

      - &deposer
        name: Déposer les journaux du job (artefact pour le verdict)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-${{ github.job }}${{ matrix.lot && format('-{0}', matrix.lot) || '' }}
          path: /tmp/sortie/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # ── Typecheck et lint ──────────────────────────────────────────────────────────────────────────────────────────────
  qualite:
    name: typecheck · lint
    needs: mode
    if: ${{ needs.mode.outputs.rapide == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *horodatage
      - *checkout
      - *node
      - *npm-ci

      # Aucune base ici : .env.test reprend l'exemple (URL locale, exigée par verify.mjs ; ni typecheck ni lint ne s'y
      # connectent)
      - name: Typecheck puis lint (scripts/verify.mjs --etapes typecheck,lint)
        id: verify
        run: |
          . /tmp/etape.sh verify
          set -o pipefail
          cp .env.test.example .env.test
          node scripts/verify.mjs --etapes typecheck,lint 2>&1 | tee /tmp/verify.log

      # Liste de référence des suites (même découverte que le run série) : le verdict vérifie que les lots la couvrent
      # exactement, chaque suite une fois
      - name: Liste des suites (scripts/run-tests.mjs --list)
        if: ${{ !cancelled() }}
        run: |
          . /tmp/etape.sh liste-suites
          set -o pipefail
          [ -f .env.test ] || cp .env.test.example .env.test
          node scripts/ci-lots.mjs liste > /tmp/liste-suites.txt
          echo "$(wc -l < /tmp/liste-suites.txt) suite(s)"

      - *annotations
      - *rassembler
      - *deposer

  # ── Tests : 4 lots en parallèle, chacun sur sa propre base Supabase locale ───────────────────────────────────────
  tests:
    name: tests ${{ matrix.lot }}/4 (Supabase local)
    needs: mode
    if: ${{ needs.mode.outputs.rapide == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lot: [1, 2, 3, 4]
    env:
      EV_GRAINE: ${{ needs.mode.outputs.graine }}
    steps:
      - *horodatage
      - *checkout
      - *node
      - *npm-ci
      - *supabase-cli
      - *supabase-start
      - *db-reset
      - *env-test
      - *seed-test

      - name: Tests du lot ${{ matrix.lot }}/4 (scripts/verify.mjs --etapes test --lot ${{ matrix.lot }}/4)
        id: verify
        run: |
          . /tmp/etape.sh verify
          set -o pipefail
          # shellcheck disable=SC2086
          node scripts/verify.mjs --etapes test --lot ${{ matrix.lot }}/4 ${EV_GRAINE:+--graine $EV_GRAINE} 2>&1 | tee /tmp/verify.log

      - *diagnostic
      - *annotations
      - *rassembler
      - *deposer

  # ── Build, poids JavaScript et e2e complet (recette, captures, fumée, terrain, pwa, perf…) ───────────────────────
  e2e:
    name: build · js-budget · e2e
    needs: mode
    if: ${{ needs.mode.outputs.rapide == '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      build: ${{ steps.build.outcome }}
      js_budget: ${{ steps.js-budget.outcome }}
      e2e_seed: ${{ steps.e2e-seed.outcome }}
      e2e: ${{ steps.e2e.outcome }}
    steps:
      - *horodatage
      - *checkout
      - *supabase-cli

      # Contre-vérification 2B (6.7) : supabase/config.toml ramène les jetons d'accès à 600 s (production et suites de tests).
      # L'e2e capture l'état de connexion de chaque rôle UNE fois (e2e/auth.setup.ts) puis le rejoue dans des dizaines de
      # contextes pendant plus de 30 min : au-delà de 10 min, chaque contexte rafraîchirait le même jeton de rafraîchissement,
      # et GoTrue (détection de réutilisation) fermerait la session, comme il le doit face à un vol. Ce job seul garde donc
      # 3 600 s ; l'échéance de 600 s et la coupure du temps réel sont prouvées par tests/parcours/cvf2b-correctif-pre-requete.
      - name: "E2E : jetons d'accès à 3 600 s pour ce job seulement (états de connexion rejoués)"
        run: |
          . /tmp/etape.sh e2e-jwt-expiry
          sed -i -E 's/^jwt_expiry = 600$/jwt_expiry = 3600/' supabase/config.toml
          grep -qx 'jwt_expiry = 3600' supabase/config.toml || { echo "::error::jwt_expiry non remplacé dans supabase/config.toml"; exit 1; }
          echo "jwt_expiry du job e2e : $(grep -E '^jwt_expiry' supabase/config.toml)"

      # Chemin critique du run : Supabase démarre pendant npm ci (même script, mêmes tentatives) ; attendu juste après
      - name: Démarrer Supabase local en arrière-plan (pendant npm ci)
        run: |
          . /tmp/etape.sh supabase-start-lance
          nohup bash scripts/ci-supabase-start.sh /tmp/supabase-start.log > /dev/null 2>&1 &
          echo "supabase start lancé en arrière-plan (journal : /tmp/supabase-start.log)"

      - *node
      - *npm-ci

      - name: Attendre Supabase local
        run: |
          . /tmp/etape.sh supabase-start-attente
          for i in $(seq 1 300); do
            [ -f /tmp/supabase-start.log.code ] && break
            sleep 2
          done
          tail -n 60 /tmp/supabase-start.log
          if [ "$(cat /tmp/supabase-start.log.code 2>/dev/null)" != "0" ]; then echo "::error::Supabase local n'a pas démarré"; exit 1; fi
          echo "Supabase local prêt"

      # Le build ne lit pas la base ; supabase start a déjà appliqué toutes les migrations depuis zéro, et la « base
      # propre » (lancée ci-dessous, pendant le build) refait db reset, seed de test et seed de démonstration, comme en série.
      - *env-test

      - name: "E2E : générer .env.e2e (instance locale, faux services, secrets aléatoires du run)"
        run: |
          . /tmp/etape.sh e2e-env
          set -euo pipefail
          supabase status -o env > /tmp/supabase-e2e.env
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase-e2e.env
          set +a
          ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ] || [ -z "${DB_URL:-}" ]; then
            echo "Impossible de lire API_URL / ANON_KEY / SERVICE_ROLE_KEY / DB_URL depuis supabase status"; exit 1
          fi
          # Secrets propres à ce run (jamais en dur, jamais affichés) : masqués dans les journaux
          gen() { openssl rand -hex 32; }
          SP_KEY="$(gen)"; SP_SECRET="$(gen)"; MT_USER="e2e-$(openssl rand -hex 6)"; MT_PASS="$(gen)"
          HOOK_SECRET="$(gen)"; CRON_SECRET_E2E="$(gen)"; OTP_SECRET="$(gen)"; TOTP_KEY="$(gen)"; PIN_KEY="$(gen)"
          # Lot 6 (contrat P4) : paire VAPID P-256 générée pour ce run (clé publique non compressée et clé privée, base64url)
          VAPID_PAIR="$(node -e "const c=require('crypto');const k=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'});const p=k.publicKey.export({format:'jwk'});const d=k.privateKey.export({format:'jwk'}).d;process.stdout.write(Buffer.concat([Buffer.from([4]),Buffer.from(p.x,'base64url'),Buffer.from(p.y,'base64url')]).toString('base64url')+' '+d)")"
          VAPID_PUB="${VAPID_PAIR%% *}"; VAPID_PRIV="${VAPID_PAIR##* }"
          if [ "${#VAPID_PUB}" -ne 87 ] || [ "${#VAPID_PRIV}" -ne 43 ]; then echo "Paire VAPID générée invalide"; exit 1; fi
          for v in "$SP_KEY" "$SP_SECRET" "$MT_PASS" "$HOOK_SECRET" "$CRON_SECRET_E2E" "$OTP_SECRET" "$TOTP_KEY" "$PIN_KEY" "$VAPID_PRIV"; do
            echo "::add-mask::${v}"
          done
          umask 077
          {
            echo "# Généré par la CI (verify.yml, lot 5.1) : instance Supabase locale, faux services, secrets aléatoires du run"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE}"
            echo "SUPABASE_DB_URL=${DB_URL}"
            # localhost : le middleware de Next redirige vers localhost (NextURL réécrit 127.x) ; le serveur écoute sur 127.0.0.1
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "E2E_APP_PORT=3000"
            echo "E2E_FAKE_SERVICES_PORT=4010"
            echo "E2E_FAKE_SERVICES_URL=http://127.0.0.1:4010"
            echo "SAMIRPAY_API_URL=http://127.0.0.1:4010/samirpay"
            echo "SAMIRPAY_API_KEY=${SP_KEY}"
            echo "SAMIRPAY_SECRET_KEY=${SP_SECRET}"
            echo "SAMIRPAY_TIMEOUT_MS=5000"
            echo "MTARGET_API_URL=http://127.0.0.1:4010/mtarget/messages"
            echo "MTARGET_USERNAME=${MT_USER}"
            echo "MTARGET_PASSWORD=${MT_PASS}"
            echo "MTARGET_SENDER=EVE2E"
            echo "RESEND_API_KEY="
            echo "NOTIFICATION_FROM_EMAIL=notifications@e2e.eventvillage.local"
            echo "SUPPORT_EMAIL=support@e2e.eventvillage.local"
            echo "SUPABASE_AUTH_HOOK_SECRET=${HOOK_SECRET}"
            echo "CRON_SECRET=${CRON_SECRET_E2E}"
            echo "OTP_HASH_SECRET=${OTP_SECRET}"
            echo "TICKET_TOTP_MASTER_KEY=${TOTP_KEY}"
            echo "REGISSEUR_PIN_KEY=${PIN_KEY}"
            # Lot 6 (contrat P4) : push web vers le faux service push local seulement
            echo "VAPID_PUBLIC_KEY=${VAPID_PUB}"
            echo "VAPID_PRIVATE_KEY=${VAPID_PRIV}"
            echo "VAPID_SUBJECT=mailto:notifications@e2e.eventvillage.local"
            echo "PUSH_ENDPOINT_ALLOWED_ORIGINS=http://127.0.0.1:4010"
            # Finition 2a (3) : recherche de lieu, aucun appel réel en CI (adresse injoignable)
            echo "NOMINATIM_URL=http://127.0.0.1:9"
            echo "NOMINATIM_CONTACT=essai@e2e.eventvillage.local"
            # Lot 7 (D37) : quotas de téléchargement des codes hors ligne relevés (captures en contextes neufs)
            echo "OFFLINE_CODES_PER_TICKET_HOUR=1000"
            echo "OFFLINE_CODES_PER_USER_HOUR=1000"
            # Lot 8 (contrat 15.1, précédent D37) : tout vient de 127.0.0.1 ; quotas par IP relevés pour le parcours de recette
            echo "SMS_OTP_PER_IP_HOUR=1000"
            echo "SMS_OTP_PER_IP_DAY=1000"
            echo "PARTNER_REGISTER_PER_IP_HOUR=100"
            # Lot 9 quinquies (A4) : le parcours e2e dure plus de 30 min et rouvre l'administration à intervalles longs ;
            # inactivité de l'administration portée à 240 min (borne haute de ADMIN_IDLE_TIMEOUT_MINUTES), jamais en production
            echo "ADMIN_IDLE_TIMEOUT_MINUTES=240"
          } > .env.e2e
          echo ".env.e2e généré : $(grep -c '=' .env.e2e) variables (URL=${API_URL}, valeurs secrètes masquées)"

      # Run 314 : seed:demo lance Chromium (Playwright) ; il est donc installé avant la base de l'e2e, qui se prépare
      # pendant le build (sans lui, seed:demo s'arrêtait sur « Executable doesn't exist » sans rendre la main).
      - name: "E2E : version de Playwright"
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: "E2E : cache du navigateur Chromium"
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: "E2E : installer Chromium"
        run: |
          . /tmp/etape.sh e2e-chromium
          set -o pipefail
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium 2>&1 | tee /tmp/e2e-install.log
          else
            npx playwright install --with-deps chromium 2>&1 | tee /tmp/e2e-install.log
          fi

      # Chemin critique : la base de l'e2e (db reset, seed de test, seed de démonstration : mêmes commandes qu'en série)
      # se prépare pendant le build, qui ne lit pas la base ; attendue avant le démarrage de l'application.
      - name: "E2E : base propre en arrière-plan (db reset, seed de test puis seed de démonstration, pendant le build)"
        run: |
          . /tmp/etape.sh e2e-seed-lance
          nohup bash -c '{ set -e; supabase db reset; npm run seed:test; EV_ENV_FILE=.env.e2e npm run seed:demo; } > /tmp/e2e-seed.log 2>&1; echo $? > /tmp/e2e-seed.code' > /dev/null 2>&1 &
          echo "base de l'e2e préparée en arrière-plan (journal : /tmp/e2e-seed.log)"

      # Mêmes commandes et même environnement qu'en série (verify.mjs : .env.test chargé, build sans EV_INTEGRATIONS,
      # clés de .env.local neutralisées). Le poids JavaScript est une étape à part : au-dessus du budget, le job est
      # rouge mais l'e2e tourne quand même sur le build (comme le build de mesure du run série).
      - name: Build (scripts/verify.mjs --etapes build)
        id: build
        run: |
          . /tmp/etape.sh build
          set -o pipefail
          node scripts/verify.mjs --etapes build 2>&1 | tee /tmp/build.log

      - name: Poids JavaScript (scripts/verify.mjs --etapes js-budget)
        id: js-budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          . /tmp/etape.sh js-budget
          set -o pipefail
          node scripts/verify.mjs --etapes js-budget 2>&1 | tee -a /tmp/build.log

      - name: "E2E : base propre (attendre db reset, seed de test et seed de démonstration)"
        id: e2e-seed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          . /tmp/etape.sh e2e-seed
          for i in $(seq 1 450); do
            [ -f /tmp/e2e-seed.code ] && break
            sleep 2
          done
          cat /tmp/e2e-seed.log
          if [ "$(cat /tmp/e2e-seed.code 2>/dev/null)" != "0" ]; then echo "::error::base de l'e2e non prête (db reset ou seed en échec)"; exit 1; fi

      - name: "E2E : démarrer les faux services et l'application (next start, arrière-plan)"
        id: e2e-start
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          . /tmp/etape.sh e2e-demarrage
          nohup node scripts/e2e/fake-services.mjs > /tmp/fake-services.log 2>&1 &
          nohup node scripts/e2e/start-app.mjs > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4010/__test/health && curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              echo "faux services et application prêts après $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=e2e::application ou faux services non prêts après 120 s"
          tail -n 60 /tmp/fake-services.log /tmp/next-start.log
          exit 1

      - name: "E2E : captures d'écran et test de fumée (npm run e2e)"
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.e2e-start.outcome == 'success' }}
        # Lot 8 (contrat 15.9) : délai propre, pour qu'une recette bloquée laisse le temps de déposer les journaux ;
        # lot CI rapide : 47 min, sous la limite de 60 min du job (installation, build et seed ≈ 8 min avant)
        timeout-minutes: 47
        run: |
          . /tmp/etape.sh e2e
          set -o pipefail
          npm run e2e 2>&1 | tee /tmp/e2e.log

      # Lot 7 (7.5, contrat 11.1) : sharp absent en production = échec (start-app.mjs arrête aussi le serveur)
      - name: "E2E : sharp présent en production (next-start.log sans sharp-missing-in-production)"
        if: ${{ !cancelled() && steps.e2e-start.outcome == 'success' }}
        run: |
          if grep -n "sharp-missing-in-production" /tmp/next-start.log; then
            echo "::error title=sharp::next start signale sharp-missing-in-production (tâche 7.5)"; exit 1
          fi
          echo "next-start.log : aucune mention sharp-missing-in-production"

      - *diagnostic
      - *annotations

      # Captures, emails, mesures, poids JavaScript et diagnostic Playwright, pour le verdict (mêmes règles qu'en série)
      - name: Rassembler les captures et mesures de l'e2e
        if: always()
        run: |
          mkdir -p /tmp/sortie
          W="$GITHUB_WORKSPACE"
          if [ -d "$W/.e2e-captures/captures" ]; then
            mkdir -p /tmp/sortie/captures && cp -r "$W/.e2e-captures/captures/." /tmp/sortie/captures/
            echo "captures : $(find /tmp/sortie/captures -name '*.png' | wc -l) PNG"
          fi
          if [ -f "$W/.verify/js-budget.tsv" ]; then cp "$W/.verify/js-budget.tsv" /tmp/sortie/js-budget.tsv; fi
          if [ -d "$W/.e2e-captures/emails" ]; then
            mkdir -p /tmp/sortie/emails
            find "$W/.e2e-captures/emails" -maxdepth 1 -type f \( -name '*.html' -o -name '*.txt' \) -exec cp {} /tmp/sortie/emails/ \;
          fi
          if [ -d "$W/.e2e-captures/perf" ]; then
            mkdir -p /tmp/sortie/perf
            find "$W/.e2e-captures/perf" -maxdepth 1 -type f \( -name '*.tsv' -o -name '*.txt' \) -exec cp {} /tmp/sortie/perf/ \;
          fi
          # Diagnostic des échecs Playwright : error-context.md (< 512 Kio) et captures test-failed-*.png
          # (< 1,5 Mio, 80 au plus), arborescence de test-results/ conservée
          if [ -d "$W/test-results" ]; then
            mkdir -p /tmp/sortie/playwright
            ( cd "$W" && find test-results -type f -name 'error-context.md' -size -512k -print0 ) | while IFS= read -r -d '' f; do mkdir -p "/tmp/sortie/playwright/$(dirname "$f")"; cp "$W/$f" "/tmp/sortie/playwright/$f"; done
            ( cd "$W" && find test-results -type f -name 'test-failed-*.png' -size -1536k -print0 | sort -z | head -z -n 80 ) | while IFS= read -r -d '' f; do mkdir -p "/tmp/sortie/playwright/$(dirname "$f")"; cp "$W/$f" "/tmp/sortie/playwright/$f"; done
          fi

      - *rassembler
      - *deposer

      - name: "E2E : rapport Playwright et traces (artefact)"
        if: ${{ always() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── Verdict : vert seulement si tout est vert ; seul job qui publie sur ci-results ───────────────────────────────
  verdict:
    name: verdict (tous les jobs verts) · journaux sur ci-results
    needs: [mode, rapide, qualite, tests, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (scripts du verdict)
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les journaux des jobs
        uses: actions/download-artifact@v4
        with:
          pattern: journaux-*
          path: /tmp/artefacts

      - name: Assembler le dossier du run et décider du verdict (scripts/ci-verdict.mjs)
        id: verdict
        env:
          EV_NEEDS: ${{ toJSON(needs) }}
          EV_T0: ${{ needs.mode.outputs.t0 }}
          RUN_DIR: /tmp/run
        run: node scripts/ci-verdict.mjs /tmp/artefacts "$RUN_DIR"

      - name: Journaux des suites de tests, tous lots (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/run/test-logs/
          if-no-files-found: ignore

      - name: Publier les journaux bruts sur la branche ci-results
        if: always()
        env:
          RUN_DIR: runs/${{ github.run_number }}-${{ github.run_id }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          set -e
          mkdir -p /tmp/ci-results && cd /tmp/ci-results
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Pointe seule (--depth=1) : l'historique contient les captures des anciens runs. Une poussée refusée (un autre
          # run a publié entre-temps) est retentée sur la nouvelle pointe, cinq fois au plus.
          for essai in 1 2 3 4 5; do
            if git fetch -q --depth=1 origin ci-results 2>/dev/null; then
              git checkout -q -f -B ci-results FETCH_HEAD
              git clean -fdq
            else
              git checkout -q --orphan ci-results
            fi
            mkdir -p "$RUN_DIR"
            if [ -d /tmp/run ]; then cp -r /tmp/run/. "$RUN_DIR/"; fi
            if [ -d "$RUN_DIR/captures" ]; then echo "captures publiées : $(find "$RUN_DIR/captures" -name '*.png' | wc -l) PNG"; fi
            # Rétention : captures et diagnostic Playwright des 5 derniers runs à la pointe de ci-results ; les journaux restent
            for kind in captures playwright; do
              for d in $(find runs -mindepth 2 -maxdepth 2 -type d -name "$kind" | sed -e 's#^runs/##' -e "s#/${kind}##" | sort -t- -k1,1n | head -n -5); do
                rm -rf "runs/${d}/${kind}"
                echo "${kind} purgé(es) de la pointe : runs/${d}/${kind}"
              done
            done
            git add -A
            git commit -q -m "ci-results: run ${{ github.run_number }} (${{ github.sha }}) — ${VERDICT:-failure}"
            if git push -q origin ci-results; then
              echo "Journaux publiés : ${{ github.server_url }}/${{ github.repository }}/tree/ci-results/${RUN_DIR}"
              exit 0
            fi
            echo "::warning::poussée sur ci-results refusée (essai ${essai}), nouvelle tentative"
            sleep $((essai * 5))
          done
          echo "::error::journaux non publiés sur ci-results après 5 essais"; exit 1

      - name: Verdict
        run: |
          echo "verdict : ${{ steps.verdict.outputs.verdict }} (mode ${{ needs.mode.outputs.rapide == '1' && 'rapide' || 'complet' }}) ; jobs : mode ${{ needs.mode.result }}, rapide ${{ needs.rapide.result }}, qualite ${{ needs.qualite.result }}, tests ${{ needs.tests.result }}, e2e ${{ needs.e2e.result }}"
          [ "${{ steps.verdict.outputs.verdict }}" = "success" ]
