name: verify

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'lot*/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · tests (Supabase local) · build
    runs-on: ubuntu-latest
    # Lot 7 (A2, contrat 11.7) : 90 min pour le run « avant » (captures à 15 s d'attente), remis à 60 en vague F
    # (fix(7.7)) : attente des captures plafonnée à 3 s (D84) ; durée mesurée runs 72 à 74 : 43 à 46 min dont
    # 24 min de captures ; estimation après D84 : ≈ 40 min (job_elapsed_s de run.txt fait foi au run suivant)
    # Lot 8 (AR11, L77) : 75 min pour le run « avant » (36 captures rouges de plus, parcours de recette, pire cas
    # projeté ≈ 68 min) ; retour à 60 si trois runs « après » restent sous 50 min, sinon 75 justifié au rapport.
    timeout-minutes: 60

    steps:
      # Lot 7 (contrat 11.7) : durée du job (délai de 60 min), écrite dans run.txt sur ci-results
      # Lot 8 (contrat 15.9, PO16 : 766 s hors verify et e2e au run 93, cause non établie) : chaque étape `run`
      # s'ouvre par `. /tmp/etape.sh <nom>`, qui note son début, sa fin et son code de sortie dans /tmp/etapes.txt ;
      # recopié dans run.txt. Mesure seule. Le temps des étapes `uses` (checkout, Node, CLI, cache) se lit dans
      # l'écart entre deux étapes. Une étape coupée par son délai ne laisse aucune ligne.
      - name: Horodatage du début du job
        run: |
          echo "EV_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          cat > /tmp/etape.sh <<'EOS'
          EV_ETAPE="$1"
          EV_ETAPE_DEBUT="$(date +%s)"
          trap 'code=$?; echo "$EV_ETAPE $EV_ETAPE_DEBUT $(date +%s) $code" >> /tmp/etapes.txt' EXIT
          EOS

      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lot 8 (AR11, L71) : le lock régénéré exige npm 10 (npm 11 le réécrit) ; version lue dans le journal et run.txt
      - name: Installer les dépendances
        run: |
          . /tmp/etape.sh npm-ci
          npm --version
          echo "EV_NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"
          npm ci

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Démarrer Supabase local (services nécessaires aux tests uniquement)
        # Lot 7 (runs 81 et 82) : le runner a refusé deux fois le port 54322 (« address already in use ») avant tout
        # test. On journalise qui écoute sur les ports locaux, puis une seule nouvelle tentative après un arrêt propre.
        run: |
          . /tmp/etape.sh supabase-start
          set -o pipefail
          echo "ports 54320-54329 avant démarrage :"; (sudo ss -ltnp | grep -E ':5432[0-9]\b' || echo "aucun")
          if ! supabase start -x studio,imgproxy,logflare,vector,edge-runtime 2>&1 | tee /tmp/supabase-start.log; then
            echo "::warning::supabase start a échoué ; ports, conteneurs, arrêt propre puis nouvelle tentative"
            (sudo ss -ltnp | grep -E ':5432[0-9]\b' || echo "aucun port 5432x à l'écoute")
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}'
            supabase stop --no-backup 2>&1 | tee -a /tmp/supabase-start.log
            sleep 15
            supabase start -x studio,imgproxy,logflare,vector,edge-runtime 2>&1 | tee -a /tmp/supabase-start.log
          fi

      - name: Appliquer toutes les migrations depuis zéro (supabase db reset)
        run: |
          . /tmp/etape.sh db-reset
          set -o pipefail
          supabase db reset 2>&1 | tee /tmp/db-reset.log

      - name: Générer .env.test depuis l'instance locale
        run: |
          . /tmp/etape.sh env-test
          supabase status -o env > /tmp/supabase.env
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase.env
          set +a
          ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "$API_URL" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ] || [ -z "$DB_URL" ]; then
            echo "Impossible de lire API_URL / ANON_KEY / SERVICE_ROLE_KEY / DB_URL depuis supabase status"; exit 1
          fi
          sed -e "s#^NEXT_PUBLIC_SUPABASE_URL=.*#NEXT_PUBLIC_SUPABASE_URL=${API_URL}#" \
              -e "s#^NEXT_PUBLIC_SUPABASE_ANON_KEY=.*#NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON}#" \
              -e "s#^SUPABASE_SERVICE_ROLE_KEY=.*#SUPABASE_SERVICE_ROLE_KEY=${SERVICE}#" \
              -e "s#^SUPABASE_DB_URL=.*#SUPABASE_DB_URL=${DB_URL}#" \
              .env.test.example > .env.test
          echo ".env.test généré : $(grep -c . .env.test) lignes (URL=${API_URL})"

      - name: Seed de test (idempotent, données fictives)
        run: |
          . /tmp/etape.sh seed-test
          set -o pipefail
          npm run seed:test 2>&1 | tee /tmp/seed.log

      - name: Vérification complète (typecheck → lint → tests → build)
        id: verify
        run: |
          . /tmp/etape.sh verify
          set -o pipefail
          npm run verify 2>&1 | tee /tmp/verify.log

      # Lot 7 (contrat 9, 11.7, 14.1) : au run « avant », les tests rouges arrêtent verify à l'étape test ; sans ce
      # build, ni la mesure du poids JavaScript (js-budget) ni les phases e2e (terrain, pwa, perf) ne tourneraient.
      # Le build est refait dans l'environnement de verify (scripts/e2e/build-mesure.mjs) ; le job reste en échec.
      - name: "Build de mesure (verify en échec : poids JavaScript et e2e quand même mesurés)"
        id: build-mesure
        if: ${{ !cancelled() && steps.verify.outcome == 'failure' }}
        run: |
          . /tmp/etape.sh build-mesure
          set -o pipefail
          node scripts/e2e/build-mesure.mjs 2>&1 | tee /tmp/build-mesure.log

      # ── Lot 5.1 : Playwright sur le build de verify (captures d'écran et test de fumée) ─────────
      # Étapes exécutées seulement si verify a réussi (lot 7 : ou si le build de mesure a abouti après un
      # échec de verify) ; chacune garde son propre résultat : un seed de
      # démonstration en échec (attendu tant que le lot 5 n'est pas livré) n'empêche ni les captures
      # possibles ni la fumée, et le job reste en échec.
      - name: "E2E : version de Playwright"
        id: pw
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: "E2E : cache du navigateur Chromium"
        id: pw-cache
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: "E2E : installer Chromium"
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') }}
        run: |
          . /tmp/etape.sh e2e-chromium
          set -o pipefail
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium 2>&1 | tee /tmp/e2e-install.log
          else
            npx playwright install --with-deps chromium 2>&1 | tee /tmp/e2e-install.log
          fi

      - name: "E2E : générer .env.e2e (instance locale, faux services, secrets aléatoires du run)"
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') }}
        run: |
          . /tmp/etape.sh e2e-env
          set -euo pipefail
          supabase status -o env > /tmp/supabase-e2e.env
          set -a
          # shellcheck disable=SC1091
          . /tmp/supabase-e2e.env
          set +a
          ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "${API_URL:-}" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ] || [ -z "${DB_URL:-}" ]; then
            echo "Impossible de lire API_URL / ANON_KEY / SERVICE_ROLE_KEY / DB_URL depuis supabase status"; exit 1
          fi
          # Secrets propres à ce run (jamais en dur, jamais affichés) : masqués dans les journaux
          gen() { openssl rand -hex 32; }
          SP_KEY="$(gen)"; SP_SECRET="$(gen)"; MT_USER="e2e-$(openssl rand -hex 6)"; MT_PASS="$(gen)"
          HOOK_SECRET="$(gen)"; CRON_SECRET_E2E="$(gen)"; OTP_SECRET="$(gen)"; TOTP_KEY="$(gen)"; PIN_KEY="$(gen)"
          # Lot 6 (contrat P4) : paire VAPID P-256 générée pour ce run (clé publique non compressée et clé privée, base64url)
          VAPID_PAIR="$(node -e "const c=require('crypto');const k=c.generateKeyPairSync('ec',{namedCurve:'prime256v1'});const p=k.publicKey.export({format:'jwk'});const d=k.privateKey.export({format:'jwk'}).d;process.stdout.write(Buffer.concat([Buffer.from([4]),Buffer.from(p.x,'base64url'),Buffer.from(p.y,'base64url')]).toString('base64url')+' '+d)")"
          VAPID_PUB="${VAPID_PAIR%% *}"; VAPID_PRIV="${VAPID_PAIR##* }"
          if [ "${#VAPID_PUB}" -ne 87 ] || [ "${#VAPID_PRIV}" -ne 43 ]; then echo "Paire VAPID générée invalide"; exit 1; fi
          for v in "$SP_KEY" "$SP_SECRET" "$MT_PASS" "$HOOK_SECRET" "$CRON_SECRET_E2E" "$OTP_SECRET" "$TOTP_KEY" "$PIN_KEY" "$VAPID_PRIV"; do
            echo "::add-mask::${v}"
          done
          umask 077
          {
            echo "# Généré par la CI (verify.yml, lot 5.1) : instance Supabase locale, faux services, secrets aléatoires du run"
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE}"
            echo "SUPABASE_DB_URL=${DB_URL}"
            # localhost : le middleware de Next redirige vers localhost (NextURL réécrit 127.x) ; le serveur écoute sur 127.0.0.1
            echo "NEXT_PUBLIC_APP_URL=http://localhost:3000"
            echo "E2E_APP_PORT=3000"
            echo "E2E_FAKE_SERVICES_PORT=4010"
            echo "E2E_FAKE_SERVICES_URL=http://127.0.0.1:4010"
            echo "SAMIRPAY_API_URL=http://127.0.0.1:4010/samirpay"
            echo "SAMIRPAY_API_KEY=${SP_KEY}"
            echo "SAMIRPAY_SECRET_KEY=${SP_SECRET}"
            echo "SAMIRPAY_TIMEOUT_MS=5000"
            echo "MTARGET_API_URL=http://127.0.0.1:4010/mtarget/messages"
            echo "MTARGET_USERNAME=${MT_USER}"
            echo "MTARGET_PASSWORD=${MT_PASS}"
            echo "MTARGET_SENDER=EVE2E"
            echo "RESEND_API_KEY="
            echo "NOTIFICATION_FROM_EMAIL=notifications@e2e.eventvillage.local"
            echo "SUPPORT_EMAIL=support@e2e.eventvillage.local"
            echo "SUPABASE_AUTH_HOOK_SECRET=${HOOK_SECRET}"
            echo "CRON_SECRET=${CRON_SECRET_E2E}"
            echo "OTP_HASH_SECRET=${OTP_SECRET}"
            echo "TICKET_TOTP_MASTER_KEY=${TOTP_KEY}"
            echo "REGISSEUR_PIN_KEY=${PIN_KEY}"
            # Lot 6 (contrat P4) : push web vers le faux service push local seulement
            echo "VAPID_PUBLIC_KEY=${VAPID_PUB}"
            echo "VAPID_PRIVATE_KEY=${VAPID_PRIV}"
            echo "VAPID_SUBJECT=mailto:notifications@e2e.eventvillage.local"
            echo "PUSH_ENDPOINT_ALLOWED_ORIGINS=http://127.0.0.1:4010"
            # Lot 7 (D37) : quotas de téléchargement des codes hors ligne relevés (captures en contextes neufs)
            echo "OFFLINE_CODES_PER_TICKET_HOUR=1000"
            echo "OFFLINE_CODES_PER_USER_HOUR=1000"
            # Lot 8 (contrat 15.1, précédent D37) : tout vient de 127.0.0.1 ; quotas par IP relevés pour le parcours de recette
            echo "SMS_OTP_PER_IP_HOUR=1000"
            echo "SMS_OTP_PER_IP_DAY=1000"
            echo "PARTNER_REGISTER_PER_IP_HOUR=100"
          } > .env.e2e
          echo ".env.e2e généré : $(grep -c '=' .env.e2e) variables (URL=${API_URL}, valeurs secrètes masquées)"

      - name: "E2E : base propre (db reset), seed de test puis seed de démonstration"
        id: e2e-seed
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') }}
        run: |
          . /tmp/etape.sh e2e-seed
          set -o pipefail
          {
            set -e
            supabase db reset
            npm run seed:test
            EV_ENV_FILE=.env.e2e npm run seed:demo
          } 2>&1 | tee /tmp/e2e-seed.log

      - name: "E2E : démarrer les faux services et l'application (next start, arrière-plan)"
        id: e2e-start
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') }}
        run: |
          . /tmp/etape.sh e2e-demarrage
          nohup node scripts/e2e/fake-services.mjs > /tmp/fake-services.log 2>&1 &
          nohup node scripts/e2e/start-app.mjs > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4010/__test/health && curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              echo "faux services et application prêts après $((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error title=e2e::application ou faux services non prêts après 120 s"
          tail -n 60 /tmp/fake-services.log /tmp/next-start.log
          exit 1

      - name: "E2E : captures d'écran et test de fumée (npm run e2e)"
        id: e2e
        if: ${{ !cancelled() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') && steps.e2e-start.outcome == 'success' }}
        # Lot 8 (contrat 15.9) : délai propre, pour qu'une recette bloquée laisse le temps de publier les journaux
        timeout-minutes: 50
        run: |
          . /tmp/etape.sh e2e
          set -o pipefail
          npm run e2e 2>&1 | tee /tmp/e2e.log

      # Lot 7 (7.5, contrat 11.1) : sharp absent en production = échec (start-app.mjs arrête aussi le serveur)
      - name: "E2E : sharp présent en production (next-start.log sans sharp-missing-in-production)"
        if: ${{ !cancelled() && steps.e2e-start.outcome == 'success' }}
        run: |
          if grep -n "sharp-missing-in-production" /tmp/next-start.log; then
            echo "::error title=sharp::next start signale sharp-missing-in-production (tâche 7.5)"; exit 1
          fi
          echo "next-start.log : aucune mention sharp-missing-in-production"

      - name: Journal du conteneur Supabase Auth (diagnostic en cas d'échec)
        if: failure()
        run: |
          . /tmp/etape.sh diagnostic-conteneurs
          for c in $(docker ps -a --format "{{.Names}}" | grep -E "supabase_(auth|db)_" ); do
            echo "===== $c =====" >> /tmp/containers.log
            docker logs --tail 300 "$c" >> /tmp/containers.log 2>&1 || true
          done
          # Lot 7 (temps-reel-billets, runs 83, 86, 87) : journal de Realtime, filtré sur la durée de tout le job
          # (et non les 300 dernières lignes, qui ne couvrent que l'e2e) : limites de débit
          # (MessagePerSecondRateLimitReached), erreurs et reprises du lecteur de changements, arrêts du flux.
          for c in $(docker ps -a --format "{{.Names}}" | grep -E "supabase_realtime_" ); do
            echo "===== $c (filtré) =====" >> /tmp/containers.log
            # -A 14 : le corps multiligne d'une erreur Postgrex (code, message, requête) suit la ligne d'en-tête ;
            # au run 88, sans lui, la cause des deux PoolingReplicationError restait illisible.
            docker logs -t "$c" 2>&1 | grep -iE -A 14 "PoolingReplicationError|ReplicationConnectionDown" | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jeton masqué>/g' | tail -300 >> /tmp/containers.log || true
            echo "----- $c (autres lignes filtrées) -----" >> /tmp/containers.log
            docker logs -t "$c" 2>&1 | grep -iE "ratelimit|rate_limit|too many|error|warn|retry|stopping|slot|poller|subscri" | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jeton masqué>/g; s/(access_token|apikey|token)=[^ &"]+/\1=<masqué>/gI' | tail -400 >> /tmp/containers.log || true
          done
          # Lot 7 (run 88) : côté Postgres, sur tout le job, les annulations et erreurs des appels du lecteur de
          # changements de Realtime (realtime.list_changes, fente de réplication), avec leur instruction.
          for c in $(docker ps -a --format "{{.Names}}" | grep -E "supabase_db_" ); do
            echo "===== $c (lecteur Realtime, filtré) =====" >> /tmp/containers.log
            docker logs -t "$c" 2>&1 | grep -iE -A 3 "canceling statement|statement timeout|list_changes|replication slot|logical decoding" | grep -viE "password|secret" | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/<jeton masqué>/g' | tail -200 >> /tmp/containers.log || true
          done
          grep -iE "error|sqlstate|failed" /tmp/containers.log | tail -60 || true

      - name: Annotations d'erreur (extraits bruts des journaux)
        if: failure()
        run: |
          for f in /tmp/db-reset.log /tmp/seed.log /tmp/verify.log /tmp/e2e-seed.log /tmp/e2e.log; do
            [ -f "$f" ] || continue
            msg=$(tail -c 1800 "$f" | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=$(basename "$f")::${msg}"
          done

      - name: Publier les journaux bruts sur la branche ci-results
        if: always()
        env:
          RUN_DIR: runs/${{ github.run_number }}-${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -e
          mkdir -p /tmp/ci-results && cd /tmp/ci-results
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # Pointe seule (--depth=1) : l'historique contient les captures des anciens runs
          if git fetch -q --depth=1 origin ci-results 2>/dev/null; then
            git checkout -q -b ci-results FETCH_HEAD
          else
            git checkout -q --orphan ci-results
          fi
          mkdir -p "$RUN_DIR"
          for f in supabase-start db-reset seed verify build-mesure containers e2e-install e2e-seed fake-services next-start e2e; do
            [ -f "/tmp/$f.log" ] && cp "/tmp/$f.log" "$RUN_DIR/$f.log"
          done
          if [ -d "$GITHUB_WORKSPACE/.test-logs" ]; then cp -r "$GITHUB_WORKSPACE/.test-logs" "$RUN_DIR/test-logs"; fi
          # Lot 5.1 : captures (PNG + index.txt) dans runs/<n>-<id>/captures/
          if [ -d "$GITHUB_WORKSPACE/.e2e-captures/captures" ]; then
            mkdir -p "$RUN_DIR/captures"
            cp -r "$GITHUB_WORKSPACE/.e2e-captures/captures/." "$RUN_DIR/captures/"
            echo "captures publiées : $(find "$RUN_DIR/captures" -name '*.png' | wc -l) PNG"
          fi
          # Lot 7 (contrat 9 et 11.6) : mesures (poids JavaScript post-build, scan, performance, durée des phases e2e),
          # sous le régime des journaux conservés (pas de rotation)
          if [ -f "$GITHUB_WORKSPACE/.verify/js-budget.tsv" ]; then cp "$GITHUB_WORKSPACE/.verify/js-budget.tsv" "$RUN_DIR/js-budget.tsv"; fi
          # Lot 7 (7.9, contrat 19.9) : emails rendus (HTML et texte), relus avec leurs captures
          if [ -d "$GITHUB_WORKSPACE/.e2e-captures/emails" ]; then
            mkdir -p "$RUN_DIR/emails"
            find "$GITHUB_WORKSPACE/.e2e-captures/emails" -maxdepth 1 -type f \( -name '*.html' -o -name '*.txt' \) -exec cp {} "$RUN_DIR/emails/" \;
            echo "emails publiés : $(find "$RUN_DIR/emails" -type f | wc -l) fichier(s)"
          fi
          if [ -d "$GITHUB_WORKSPACE/.e2e-captures/perf" ]; then
            mkdir -p "$RUN_DIR/perf"
            find "$GITHUB_WORKSPACE/.e2e-captures/perf" -maxdepth 1 -type f \( -name '*.tsv' -o -name '*.txt' \) -exec cp {} "$RUN_DIR/perf/" \;
            echo "mesures publiées : $(find "$RUN_DIR/perf" -type f | wc -l) fichier(s)"
          fi
          # Diagnostic des échecs Playwright : error-context.md (< 512 Kio) et captures test-failed-*.png
          # (< 1,5 Mio, 80 au plus), arborescence de test-results/ conservée, dans runs/<n>-<id>/playwright/
          if [ -d "$GITHUB_WORKSPACE/test-results" ]; then
            mkdir -p "$RUN_DIR/playwright"
            ( cd "$GITHUB_WORKSPACE" && find test-results -type f -name 'error-context.md' -size -512k -print0 ) | while IFS= read -r -d '' f; do mkdir -p "$RUN_DIR/playwright/$(dirname "$f")"; cp "$GITHUB_WORKSPACE/$f" "$RUN_DIR/playwright/$f"; done
            ( cd "$GITHUB_WORKSPACE" && find test-results -type f -name 'test-failed-*.png' -size -1536k -print0 | sort -z | head -z -n 80 ) | while IFS= read -r -d '' f; do mkdir -p "$RUN_DIR/playwright/$(dirname "$f")"; cp "$GITHUB_WORKSPACE/$f" "$RUN_DIR/playwright/$f"; done
            echo "diagnostic Playwright publié : $(find "$RUN_DIR/playwright" -name 'error-context.md' | wc -l) contexte(s), $(find "$RUN_DIR/playwright" -name '*.png' | wc -l) capture(s) d'échec"
          fi
          # Rétention : captures et diagnostic Playwright des 5 derniers runs à la pointe de ci-results ; les journaux restent
          for kind in captures playwright; do
            for d in $(find runs -mindepth 2 -maxdepth 2 -type d -name "$kind" | sed -e 's#^runs/##' -e "s#/${kind}##" | sort -t- -k1,1n | head -n -5); do
              rm -rf "runs/${d}/${kind}"
              echo "${kind} purgé(es) de la pointe : runs/${d}/${kind}"
            done
          done
          {
            echo "run_id=${{ github.run_id }}"
            echo "run_number=${{ github.run_number }}"
            echo "sha=${{ github.sha }}"
            echo "ref=${{ github.ref }}"
            echo "job_status=${JOB_STATUS}"
            echo "build_mesure=${{ steps.build-mesure.outcome }}"
            echo "e2e_seed=${{ steps.e2e-seed.outcome }}"
            echo "e2e=${{ steps.e2e.outcome }}"
            echo "url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            if [ -n "${EV_JOB_STARTED_AT:-}" ]; then echo "job_elapsed_s=$(( $(date +%s) - EV_JOB_STARTED_AT ))"; fi
            # Lot 8 (L71, contrat 15.9) : version de npm, puis une ligne par étape, secondes comptées depuis le début du job
            echo "npm_version=${EV_NPM_VERSION:-inconnue}"
            if [ -n "${EV_JOB_STARTED_AT:-}" ] && [ -f /tmp/etapes.txt ]; then
              awk -v t0="$EV_JOB_STARTED_AT" '{ printf "etape_%s=debut_s:%d duree_s:%d code:%s\n", $1, $2 - t0, $3 - $2, $4 }' /tmp/etapes.txt
            fi
          } > "$RUN_DIR/run.txt"
          git add -A
          git commit -q -m "ci-results: run ${{ github.run_number }} (${{ github.sha }}) — ${JOB_STATUS}"
          git push -q origin ci-results
          echo "Journaux publiés : ${{ github.server_url }}/${{ github.repository }}/tree/ci-results/${RUN_DIR}"

      - name: Journaux des suites de tests (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: .test-logs/
          if-no-files-found: ignore

      - name: "E2E : rapport Playwright et traces (artefact)"
        if: ${{ always() && (steps.verify.outcome == 'success' || steps.build-mesure.outcome == 'success') }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
