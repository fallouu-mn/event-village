<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mark-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="mark-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF6B35" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Ticket & Village Hub Icon -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#mark-grad-primary)" filter="url(#mark-shadow)"/>
  
  <!-- Stylized Event Pin / Village Roof -->
  <path d="M50 25 L70 45 H59 V68 H41 V45 H30 Z" fill="#FFFFFF" fill-opacity="0.98"/>
  
  <!-- Ticket Notch Accent Circles on Left & Right -->
  <circle cx="10" cy="50" r="7" fill="#FAFAFA" />
  <circle cx="90" cy="50" r="7" fill="#FAFAFA" />
  
  <!-- Dynamic Pulse Star / Beacon -->
  <circle cx="50" cy="52" r="5" fill="#FF6B35" />
</svg>
