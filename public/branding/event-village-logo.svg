<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Event Village Mark -->
  <g transform="translate(10, 10)">
    <!-- Gradient definition -->
    <defs>
      <linearGradient id="ev-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF6A3D" />
        <stop offset="100%" stop-color="#FF3D68" />
      </linearGradient>
      <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.35"/>
      </filter>
    </defs>

    <!-- Outer Rounded Ticket & Village Hub Icon -->
    <rect x="4" y="4" width="72" height="72" rx="22" fill="url(#ev-grad-primary)" filter="url(#shadow)"/>
    
    <!-- Stylized Event Pin / Village Roof -->
    <path d="M40 18 L58 36 H48 V56 H32 V36 H22 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    
    <!-- Ticket Notch Accent Circles on Left & Right -->
    <circle cx="4" cy="40" r="6" fill="#F8F9FA" />
    <circle cx="76" cy="40" r="6" fill="#F8F9FA" />
    
    <!-- Dynamic Pulse Star / Beacon -->
    <circle cx="40" cy="42" r="4" fill="#FF5722" />
  </g>

  <!-- Typography: Event Village -->
  <g transform="translate(105, 26)">
    <!-- "EVENT" in bold modern geometric font -->
    <text x="0" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.03em" fill="#0F172A">
      EVENT
    </text>
    <!-- "VILLAGE" in Orange Brand Accent -->
    <text x="100" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.03em" fill="#FF5722">
      VILLAGE
    </text>
    <!-- Tagline -->
    <text x="2" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.18em" fill="#64748B">
      PLATEFORME ÉVÉNEMENTIELLE
    </text>
  </g>
</svg>
