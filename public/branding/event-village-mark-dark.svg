<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mark-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A3D" />
      <stop offset="100%" stop-color="#FF3D68" />
    </linearGradient>
    <filter id="mark-shadow-dark" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF5722" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Ticket & Village Hub Icon -->
  <rect x="10" y="10" width="80" height="80" rx="24" fill="url(#mark-grad-dark)" filter="url(#mark-shadow-dark)"/>
  
  <!-- Stylized Event Pin / Village Roof -->
  <path d="M50 25 L70 45 H59 V68 H41 V45 H30 Z" fill="#FFFFFF" fill-opacity="0.98"/>
  
  <!-- Ticket Notch Accent Circles on Left & Right (Dark BG #0F0F11) -->
  <circle cx="10" cy="50" r="7" fill="#0F0F11" />
  <circle cx="90" cy="50" r="7" fill="#0F0F11" />
  
  <!-- Dynamic Pulse Star / Beacon -->
  <circle cx="50" cy="52" r="5" fill="#FF5722" />
</svg>
