<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <!-- Event Village Mark Dark Mode -->
  <g transform="translate(10, 10)">
    <defs>
      <linearGradient id="ev-grad-primary-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF6A3D" />
        <stop offset="100%" stop-color="#FF3D68" />
      </linearGradient>
      <filter id="shadow-dark" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF5722" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- Outer Rounded Ticket & Village Hub Icon -->
    <rect x="4" y="4" width="72" height="72" rx="22" fill="url(#ev-grad-primary-dark)" filter="url(#shadow-dark)"/>
    
    <!-- Stylized Event Pin / Village Roof -->
    <path d="M40 18 L58 36 H48 V56 H32 V36 H22 Z" fill="#FFFFFF" fill-opacity="0.98"/>
    
    <!-- Ticket Notch Accent Circles on Left & Right (Match Dark BG #0F0F11) -->
    <circle cx="4" cy="40" r="6" fill="#0F0F11" />
    <circle cx="76" cy="40" r="6" fill="#0F0F11" />
    
    <!-- Dynamic Pulse Star / Beacon -->
    <circle cx="40" cy="42" r="4" fill="#FF5722" />
  </g>

  <!-- Typography: Event Village for Dark Backgrounds -->
  <g transform="translate(105, 26)">
    <!-- "EVENT" in pure white -->
    <text x="0" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.03em" fill="#FFFFFF">
      EVENT
    </text>
    <!-- "VILLAGE" in Orange Brand Accent -->
    <text x="100" y="30" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.03em" fill="#FF5722">
      VILLAGE
    </text>
    <!-- Tagline -->
    <text x="2" y="46" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="0.18em" fill="#94A3B8">
      PLATEFORME ÉVÉNEMENTIELLE
    </text>
  </g>
</svg>
